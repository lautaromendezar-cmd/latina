  .btn::after{

  .foot{text-align:center;flex:0 0 auto}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.btn{opacity:1;transform:none}}
  /* short / landscape fallback: allow scroll instead of clipping */
  @media (max-height:560px){body{height:auto;overflow:auto}.wrap{height:auto;min-height:100dvh}}
</style>
